# Neil-side scenario + grader parameters (loaded by neil.launch.py).
#
# Notes:
#   * radius/omega drive the map -> base_link skidpad circle.
#   * mount_x / mount_z are the static base_link -> camera translation
#     (y is 0.0 by convention for a forward-mounted camera).
#   * cones_camera_flat stores 8 cones (x, y, z) flattened to length 24
#     because rclpy parameters do not support nested arrays; code reshapes
#     to a list-of-list-of-floats.
tf_scenario_node:
  ros__parameters:
    radius: 9.125
    omega: 0.5
    cone_hz: 20.0
    tf_hz: 50.0
    mount_x: 0.5
    mount_z: 0.2
    cones_camera_flat: [
      5.0, -1.5, 0.0,
      5.0,  1.5, 0.0,
      8.0, -2.5, 0.0,
      8.0,  2.5, 0.0,
      11.0, -3.0, 0.0,
      11.0,  3.0, 0.0,
      14.0, -3.5, 0.0,
      14.0,  3.5, 0.0,
    ]

grader:
  ros__parameters:
    part1_tolerance_m: 0.05
    part2_tolerance_m: 0.15
    match_window: 50
    discovery_period_s: 2.0
    grade_period_s: 2.0
    mount_x: 0.5
    mount_z: 0.2
    cones_camera_flat: [
      5.0, -1.5, 0.0,
      5.0,  1.5, 0.0,
      8.0, -2.5, 0.0,
      8.0,  2.5, 0.0,
      11.0, -3.0, 0.0,
      11.0,  3.0, 0.0,
      14.0, -3.5, 0.0,
      14.0,  3.5, 0.0,
    ]
